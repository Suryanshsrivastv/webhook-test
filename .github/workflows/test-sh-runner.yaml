name: test-sh-runner

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Build
        run: echo "Build Successful"

  notify:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Notify Teams
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Build Successful"}' \
          "${{ secrets.TEAMS_WEBHOOK }}"