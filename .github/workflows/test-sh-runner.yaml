notify:
  needs: build
  runs-on: self-hosted

  steps:
    - name: Notify Teams
      run: |
        curl -X POST \
        -H "Content-Type: application/json" \
        -d '{
          "text":"✅ Build Successful\nRepository: '${{ github.repository }}'\nBranch: '${{ github.ref_name }}'"
        }' \
        "${{ secrets.TEAMS_WEBHOOK }}"